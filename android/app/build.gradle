plugins {
    id 'com.android.application'
}

def ciBuildNumber = System.getenv('GITHUB_RUN_NUMBER')
def resolvedVersionCode = ciBuildNumber ? ciBuildNumber.toInteger() : 2
def resolvedVersionName = ciBuildNumber ? "1.1.${ciBuildNumber}" : "1.1"

android {
    namespace 'com.artmemo.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.artmemo.app"
        minSdk 26
        targetSdk 34
        versionCode resolvedVersionCode
        versionName resolvedVersionName
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion '1.8.22'
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.webkit:webkit:1.11.0'
}
