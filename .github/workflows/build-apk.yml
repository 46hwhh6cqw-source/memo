name: Build Art Memo APK

on:
  push:
    branches:
      - claude/art-notepad-app-392o33
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: android/*.gradle

      - name: Keep one signing key for every installed update
        if: github.event_name == 'push'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: artmemo-debug-keystore-push-v1

      - name: Ensure stable debug signing key
        if: github.event_name == 'push'
        shell: bash
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleDebug 2>&1 | tee build.log

      - name: Prepare APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ArtMemo.apk

      - name: Publish fixed latest download
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest ArtMemo.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create latest ArtMemo.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "アートメモ帳 最新版" \
              --notes "アプリ内の更新ボタンが取得する最新版APKです。" \
              --latest
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: art-memo-apk-${{ github.event_name }}
          path: ArtMemo.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-memo-build-log-${{ github.event_name }}
          path: android/build.log
          if-no-files-found: warn
          retention-days: 7
